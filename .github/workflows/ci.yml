name: CI

on:
  push:
    branches: [ main, 'feature-*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: |
          mkdir -p out
          find src -name "*.java" > sources.txt
          xargs -a sources.txt javac -d out
